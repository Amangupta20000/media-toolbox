name: Build local agent installers

on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run agent:package -- --${{ matrix.platform }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: media-toolbox-agent-${{ matrix.platform }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
