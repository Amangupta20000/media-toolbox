name: Build local agent installers

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to package (use a single platform only when rerunning an existing release tag)"
        required: true
        default: all
        type: choice
        options:
          - all
          - mac
          - win
          - linux
  push:
    tags:
      - "agent-v*"

jobs:
  select-platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        env:
          SELECTED_PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          if [[ "$SELECTED_PLATFORMS" != "all" && "$GITHUB_REF" != refs/tags/agent-v* ]]; then
            echo "A single-platform build must be dispatched from an existing agent-v* release tag." >&2
            exit 1
          fi
          case "$SELECTED_PLATFORMS" in
            all)
              echo 'matrix={"include":[{"os":"macos-latest","platform":"mac","artifact":"mac"},{"os":"windows-latest","platform":"win","artifact":"win"},{"os":"ubuntu-latest","platform":"linux","artifact":"linux"}]}' >> "$GITHUB_OUTPUT"
              ;;
            mac)
              echo 'matrix={"include":[{"os":"macos-latest","platform":"mac","artifact":"mac"}]}' >> "$GITHUB_OUTPUT"
              ;;
            win)
              echo 'matrix={"include":[{"os":"windows-latest","platform":"win","artifact":"win"}]}' >> "$GITHUB_OUTPUT"
              ;;
            linux)
              echo 'matrix={"include":[{"os":"ubuntu-latest","platform":"linux","artifact":"linux"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported platform selection: $SELECTED_PLATFORMS" >&2
              exit 1
              ;;
          esac

  release-init:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; keeping it available for platform uploads."
          else
            release_notes="$(cat docs/macos-first-launch.md)"
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Media Toolbox Agent $GITHUB_REF_NAME" \
              --notes "$release_notes" \
              --generate-notes
          fi

  package:
    needs:
      - select-platforms
      - release-init
    if: ${{ always() && needs.select-platforms.result == 'success' && (needs.release-init.result == 'success' || needs.release-init.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Create dependency cache fingerprint
        run: node scripts/create-agent-dependency-cache-key.mjs agent/package-lock.json .agent-dependency-cache.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .agent-dependency-cache.json
      - name: Cache Electron packaging downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.agent-dependency-cache.json', 'electron-builder.yml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-${{ runner.arch }}-node22-
      - name: Cache bundled Untrunc
        if: matrix.platform != 'win'
        id: untrunc-cache
        uses: actions/cache@v4
        with:
          path: vendor/untrunc
          key: untrunc-${{ matrix.platform }}-${{ runner.arch }}-9d86ec9ef2ffed1bf8131abe80742c0574db52b6
          restore-keys: |
            untrunc-${{ matrix.platform }}-${{ runner.arch }}-
      - name: Install macOS Untrunc build dependency
        if: matrix.platform == 'mac' && steps.untrunc-cache.outputs.cache-hit != 'true'
        run: brew install yasm
      - name: Install Linux Untrunc build dependencies
        if: matrix.platform == 'linux' && steps.untrunc-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ca-certificates g++ git make wget xz-utils yasm
      - name: Prepare bundled Untrunc on macOS or Linux
        if: matrix.platform != 'win'
        shell: bash
        run: bash scripts/prepare-untrunc.sh
      - name: Prepare bundled Untrunc on Windows
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/prepare-untrunc-windows.ps1
      - name: Check macOS signing credentials
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK:-}" ] && [ -n "${CSC_KEY_PASSWORD:-}" ] && \
             [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && \
             [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "All macOS signing and notarization credentials are configured."
          else
            echo "::warning::macOS signing credentials are incomplete; this build will be unsigned and may show a Gatekeeper warning."
          fi
      - name: Embed license public key
        env:
          AGENT_LICENSE_PUBLIC_KEY: ${{ vars.AGENT_LICENSE_PUBLIC_KEY }}
        shell: bash
        run: node scripts/stage-agent-license-public-key.mjs
      - name: Embed licensing server URL
        env:
          AGENT_LICENSE_SERVER_URL: ${{ vars.AGENT_LICENSE_SERVER_URL }}
        shell: bash
        run: node scripts/stage-agent-license-server-url.mjs
      - name: Embed runtime update public key
        env:
          AGENT_RUNTIME_UPDATE_PUBLIC_KEY: ${{ vars.AGENT_RUNTIME_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${AGENT_RUNTIME_UPDATE_PUBLIC_KEY:-}" ]; then
            node scripts/stage-agent-runtime-update-key.mjs
          else
            echo "::warning::AGENT_RUNTIME_UPDATE_PUBLIC_KEY is not configured; verified runtime update artifacts will not be published for this release."
          fi
      - name: Stage agent-only packaging directory
        run: node scripts/stage-agent-package.mjs
      - name: Verify embedded licensing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s .agent-build/agent/license-public-key.pem
          test -s .agent-build/agent/license-server-url.txt
          grep -Eq '^https://[^[:space:]]+$' .agent-build/agent/license-server-url.txt
      - name: Cache rebuilt agent-only dependencies
        id: agent-deps-cache
        uses: actions/cache@v4
        with:
          path: .agent-build/node_modules
          key: agent-deps-${{ runner.os }}-${{ runner.arch }}-node22-electron37.10.3-abi136-${{ hashFiles('.agent-dependency-cache.json') }}
          restore-keys: |
            agent-deps-${{ runner.os }}-${{ runner.arch }}-node22-electron37.10.3-abi136-
      - name: Install agent-only packaging dependencies
        if: steps.agent-deps-cache.outputs.cache-hit != 'true'
        working-directory: .agent-build
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Rebuild native agent dependencies
        if: steps.agent-deps-cache.outputs.cache-hit != 'true'
        working-directory: .agent-build
        run: npx --no-install electron-rebuild --version 37.10.3 --parallel
      - name: Package macOS installer
        if: matrix.platform == 'mac'
        working-directory: .agent-build
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK:-}" ] && [ -n "${CSC_KEY_PASSWORD:-}" ] && \
             [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && \
             [ -n "${APPLE_TEAM_ID:-}" ]; then
            npx --no-install electron-builder --config electron-builder.yml --mac --publish never
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            # Keep unsigned development releases updateable on macOS by creating a
            # complete ad-hoc app signature. Developer ID signing is still used
            # automatically whenever the production secrets above are present.
            npx --no-install electron-builder --config electron-builder.yml --config.mac.identity=- --publish never
          fi
      - name: Verify packaged agent bootstrap modules
        if: matrix.platform == 'mac'
        working-directory: .agent-build
        shell: bash
        run: |
          set -euo pipefail
          app_asar="$(find release -type f -path '*/Contents/Resources/app.asar' -print -quit)"
          test -n "$app_asar"
          npx --no-install asar list "$app_asar" | grep -Fx '/agent/auth.js'
          npx --no-install asar list "$app_asar" | grep -Fx '/agent/token.js'
      - name: Package Linux installer target
        if: matrix.platform == 'linux'
        working-directory: .agent-build
        run: npx --no-install electron-builder --config electron-builder.yml --linux AppImage deb --publish never
      - name: Package Windows installer
        if: matrix.platform == 'win'
        working-directory: .agent-build
        run: npx --no-install electron-builder --config electron-builder.yml --win --publish never
      - name: Package signed agent runtime update
        env:
          AGENT_RUNTIME_UPDATE_PRIVATE_KEY: ${{ secrets.AGENT_RUNTIME_UPDATE_PRIVATE_KEY }}
          # This workflow publishes a full installer release. Runtime-only
          # payloads must not advertise a desktop update for these tags.
          AGENT_UPDATE_TYPE: full
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${AGENT_RUNTIME_UPDATE_PRIVATE_KEY:-}" ] && [ -s .agent-build/agent/runtime-update-public-key.pem ]; then
            node scripts/package-agent-runtime.mjs .agent-build .agent-build/release
          else
            echo "::warning::AGENT_RUNTIME_UPDATE_PRIVATE_KEY or the public key is missing; verified runtime update artifacts will not be published for this release."
          fi
      - name: Normalize updater artifact names
        run: node scripts/normalize-agent-artifacts.mjs .agent-build/release
      - name: Stage installer files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find .agent-build/release -maxdepth 1 -type f \( \
            -name '*.dmg' -o \
            -name '*.zip' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name 'latest*.yml' -o \
            -name '*.blockmap' -o \
            -name 'agent-runtime-manifest-*.json' \
          \) -exec cp {} upload/ \;
          test -n "$(find upload -maxdepth 1 -type f -print -quit)"
      - name: Upload release files directly
        if: startsWith(github.ref, 'refs/tags/agent-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" upload/* --repo "$GITHUB_REPOSITORY" --clobber; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 2; fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/agent-v') }}
        with:
          name: media-toolbox-agent-${{ matrix.artifact }}
          path: upload/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --verify-tag
