name: Build local agent installers

on:
  workflow_dispatch:
  push:
    tags:
      - "agent-v*"

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run agent:package -- --${{ matrix.platform }} --publish never
      - name: Stage installer files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find release -maxdepth 1 -type f \( \
            -name '*.dmg' -o \
            -name '*.zip' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' \
          \) -exec cp {} upload/ \;
          test -n "$(find upload -maxdepth 1 -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: media-toolbox-agent-${{ matrix.platform }}
          path: upload/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/agent-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Media Toolbox Agent ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: release/**/*
