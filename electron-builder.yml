appId: com.mediatoolbox.agent
productName: Media Toolbox Agent
publish:
  provider: github
  owner: Amangupta20000
  repo: media-toolbox
  releaseType: release
directories:
  output: release
files:
  - agent/**/*
  # This file is generated immediately before release packaging. Keep it as an
  # explicit include so the online licensing endpoint cannot be omitted from a
  # packaged agent by an ignore rule or a release repair step.
  - agent/license-server-url.txt
  # The owner dashboard can start the SSD licensing service without a
  # separate Terminal or Node installation. It is only exposed through the
  # fixed Electron IPC action and still binds to loopback.
  - lib/**/*
  # Keep this shared runtime module explicit because agent/auth.js imports it
  # from inside app.asar at startup.
  - lib/token.js
  - worker/**/*
  - vendor/untrunc/**/*
  - components/processing-client.js
  - package.json
  # Keep the desktop agent self-contained, but do not ship the Next.js website
  # and its development dependencies. The previous node_modules/**/* pattern
  # added hundreds of megabytes that the agent never loads.
  - node_modules/@ffmpeg-installer/**/*
  - node_modules/@ffprobe-installer/**/*
  - node_modules/@img/**/*
  - node_modules/@pdf-lib/**/*
  - node_modules/@napi-rs/**/*
  - node_modules/@tesseract.js-data/eng/**/*
  - node_modules/@peculiar/**/*
  - node_modules/@noble/**/*
  - node_modules/asn1js/**/*
  - node_modules/base64-js/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/electron-updater/**/*
  - node_modules/builder-util-runtime/**/*
  - node_modules/fs-extra/**/*
  - node_modules/js-yaml/**/*
  - node_modules/lazy-val/**/*
  - node_modules/lodash.escaperegexp/**/*
  - node_modules/lodash.isequal/**/*
  - node_modules/tiny-typed-emitter/**/*
  - node_modules/semver/**/*
  - node_modules/sax/**/*
  - node_modules/debug/**/*
  - node_modules/ms/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - node_modules/argparse/**/*
  - node_modules/bindings/**/*
  - node_modules/bl/**/*
  - node_modules/buffer/**/*
  - node_modules/busboy/**/*
  - node_modules/bytestreamjs/**/*
  - node_modules/chownr/**/*
  - node_modules/decompress-response/**/*
  - node_modules/deep-extend/**/*
  - node_modules/detect-libc/**/*
  - node_modules/end-of-stream/**/*
  - node_modules/expand-template/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/fs-constants/**/*
  - node_modules/github-from-package/**/*
  - node_modules/ieee754/**/*
  - node_modules/inherits/**/*
  - node_modules/ini/**/*
  - node_modules/mimic-response/**/*
  - node_modules/minimist/**/*
  - node_modules/mkdirp-classic/**/*
  - node_modules/napi-build-utils/**/*
  - node_modules/node-abi/**/*
  - node_modules/once/**/*
  - node_modules/pako/**/*
  - node_modules/pdf-lib/**/*
  - node_modules/pkijs/**/*
  - node_modules/prebuild-install/**/*
  - node_modules/pump/**/*
  - node_modules/pvtsutils/**/*
  - node_modules/pvutils/**/*
  - node_modules/rc/**/*
  - node_modules/readable-stream/**/*
  - node_modules/reflect-metadata/**/*
  - node_modules/safe-buffer/**/*
  - node_modules/selfsigned/**/*
  - node_modules/semver/**/*
  - node_modules/sharp/**/*
  - node_modules/simple-concat/**/*
  - node_modules/simple-get/**/*
  - node_modules/streamsearch/**/*
  - node_modules/string_decoder/**/*
  - node_modules/strip-json-comments/**/*
  - node_modules/tar-fs/**/*
  - node_modules/tar-stream/**/*
  - node_modules/tesseract.js/**/*
  - node_modules/tesseract.js-core/**/*
  - node_modules/tslib/**/*
  - node_modules/tsyringe/**/*
  - node_modules/tunnel-agent/**/*
  - node_modules/util-deprecate/**/*
  - node_modules/webcrypto-core/**/*
  - node_modules/wrappy/**/*
  # These are website-only dependencies. electron-builder also discovers
  # production dependencies from the root package.json, so exclude them
  # explicitly after the agent runtime allow-list above.
  - "!node_modules/next/**/*"
  - "!node_modules/@next/**/*"
  - "!node_modules/react/**/*"
  - "!node_modules/react-dom/**/*"
  - "!node_modules/lucide-react/**/*"
asar: true
extraMetadata:
  main: agent/electron-main.cjs
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/@ffmpeg-installer/**
  - node_modules/@ffprobe-installer/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - vendor/untrunc/**
# Native modules are rebuilt explicitly by the release workflow on a cache miss.
# Keeping packaging itself from rebuilding them allows CI to reuse the complete
# Electron-compatible dependency tree on later releases.
nativeRebuilder: parallel
npmRebuild: false
extraResources:
  - from: build/app-update.yml
    to: app-update.yml
  # Spawned child processes cannot use scripts inside app.asar. Keep the
  # licensing runtime in the real Electron Resources directory.
  - from: license-server
    to: license-server
  # The external licensing server imports this shared token module by its
  # relative ../lib path. Keep that one shared module beside it as well.
  - from: lib/token.js
    to: lib/token.js
  # The external licensing server runs from Resources/license-server rather
  # than app.asar. Keep its native SQLite package and its runtime CommonJS
  # dependencies in a real Resources/node_modules tree so Node's ESM package
  # resolver can find them from store.js.
  - from: node_modules/better-sqlite3
    to: node_modules/better-sqlite3
    filter:
      - lib/**/*
      - build/Release/better_sqlite3.node
      - package.json
  - from: node_modules/bindings
    to: node_modules/bindings
    filter:
      - bindings.js
      - package.json
  - from: node_modules/file-uri-to-path
    to: node_modules/file-uri-to-path
    filter:
      - index.js
      - package.json
mac:
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  maintainer: support@media-toolbox.app
  target:
    - AppImage
    - deb
