appId: com.mediatoolbox.agent
productName: Media Toolbox Agent
directories:
  output: release
files:
  - agent/**/*
  - lib/**/*
  - worker/**/*
  - vendor/untrunc/**/*
  - components/processing-client.js
  - node_modules/**/*
  - package.json
asar: true
extraMetadata:
  main: agent/electron-main.cjs
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/@ffmpeg-installer/**
  - node_modules/@ffprobe-installer/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - vendor/untrunc/**
npmRebuild: true
mac:
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
